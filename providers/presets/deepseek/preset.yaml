id: deepseek
display_name: DeepSeek
protocol: openai_compat
base_url: https://api.deepseek.com/v1
registration_url: https://platform.deepseek.com
reasoning_effort_style: deepseek
reasoning_style: thinking_extra_body
reasoning_effort_options: [low, high, max]
image_token_reserve: 384
image_detail_supported: false
# 官方视觉文档只展示 image_url.url；每图按 384 token 预算预留。
# 官方 Search API 是 provider 级独立接口，不绑定聊天模型。
search_channel: deepseek_tools_search
search_label: DeepSeek Search（provider 级）
search_payload:
  # DeepSeek Search API 的 query 上限是 128 个 Unicode 字符。
  query_max_chars: 128
  # 官方 Fetch API 与 Search 同一 host，用于按需读取单个网页正文。
  fetch_path: /tools/fetch
  request:
    need_content: true
    # 原始问题有助于搜索意图理解；当前工具只有一个 query，直接复用。
    ori_question: "{query}"

models:
  - id: deepseek-flash
    display_name: DeepSeek V4.1 Flash（推荐 · 1M 上下文 · 支持视觉）
    capabilities: [chat, tool_call, reasoning, vision]
    context_length: 1000000
    notes: 官方模型名仍为 deepseek-flash，实际由 DeepSeek-V4.1-Flash-1017 提供；旧 v4-flash 名称仅兼容。

  - id: deepseek-v4-pro
    display_name: DeepSeek V4 Pro（重推理 · 1M 上下文）
    capabilities: [chat, tool_call, reasoning]
    context_length: 1000000
    notes: 重推理模型；不支持视觉输入。

  # deepseek-chat / deepseek-reasoner 已下线，仅保留在 model_capabilities.yaml
  # 中用于历史配置兼容，不再出现在新用户的选择列表里。
